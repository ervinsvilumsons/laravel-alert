name: Policy

on:
  pull_request:
    branches:
      - main

jobs:
  source-branch:
    runs-on: ubuntu-latest

    steps:
      - name: Check source branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "${HEAD_REF}" != "staging" ]; then
            echo "❌ Only staging can be merged into main."
            exit 1
          fi

          echo "✅ PR is from staging."