name: Tests

on:
  pull_request:
    branches:
      - staging
  push:
    branches:
      - staging

jobs:
  tests:
    runs-on: ubuntu-latest

    env:
      PHP_VERSION: "8.4"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: xdebug
      
      - name: Prepare environment
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Run tests
        run: composer check