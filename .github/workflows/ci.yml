name: Tests

on:
  pull_request:
    branches:
      - staging
  push:
    branches:
      - staging

jobs:
  should-run:
    name: Check whether CI should run
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
         
      - name: Check main
        id: check
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main --quiet

          if git show-ref --verify --quiet refs/remotes/origin/main; then
            if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
              echo "staging points to the same commit as main; skipping CI."
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          
          echo "staging does not point to main; running CI."
          echo "run=true" >> "$GITHUB_OUTPUT"

  ci:
    needs: should-run 
    if: needs.should-run.outputs.run == 'true'
    runs-on: ${{ matrix.os }}

    env:
      PHP_COVERAGE_VERSION: '8.5'
      OS_COVERAGE: ubuntu-latest

    strategy:
        fail-fast: true
        matrix:
            os: [ubuntu-latest, macos-latest, windows-latest]
            php: ['8.4', '8.5']

    name: PHP ${{ matrix.php }} on ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: >
            dom,
            curl,
            fileinfo,
            libxml,
            mbstring,
            zip
          coverage: xdebug

      - name: Get Composer cache directory
        id: composer-cache
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-
      
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Run tests
        if: matrix.os != env.OS_COVERAGE
        run: composer test

      - name: Run tests with quality & coverage
        if: matrix.os == env.OS_COVERAGE
        run: composer check

      - name: Upload coverage reports to Codecov
        if: matrix.os == env.OS_COVERAGE && matrix.php == env.PHP_COVERAGE_VERSION
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
